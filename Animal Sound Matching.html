else if(p=="live")h=`<h2>FIND YOUR TEAMMATES!</h2><div class="sw" id="sw">00:00.0</div><div class="sub">Make your animal sound and find your team! Teams done: ${S.fin.length} / ${K()}</div>`;
else if(p=="results"){const rows=S.fin.map((f,i)=>({ti:f.ti,ms:f.ms,pos:i+1,pt:topPts()-i})).concat(S.teams.map((t,ti)=>ti).filter(ti=>fi(ti)<0).map(ti=>({ti,pos:"–",pt:0})));
h=`<div style="font-size:80px">🏆</div><h1>RESULTS</h1>${S.fin.length?`<div class="sub">${AN[S.teams[S.fin[0].ti].a].n} team wins!</div>`:""}<div class="box"><table><tr><th>Place</th><th>Team</th><th>Time</th><th>Points</th></tr>${rows.map(r=>`<tr><td><b>${r.pos}</b></td><td>${svgS(S.teams[r.ti].a)} ${AN[S.teams[r.ti].a].n} (${S.teams[r.ti].size})</td><td>${r.ms!=null?fmt(r.ms):"—"}</td><td><b>${r.pt}</b></td></tr>`).join("")}</table></div><button class="btn" onclick="A.newgame()">NEW GAME</button>`}
$("app").innerHTML=h;
if(reveal)T.push(setInterval(()=>{cd--;if(cd<=0)A.hide();else $("cd").textContent=cd},1000));
if(p=="live")T.push(setInterval(tick,100));tick()}
const svgS=i=>svg(i).replace("<svg",'<svg style="width:46px;height:46px;vertical-align:middle"');
function tick(){if(S.ph!="live")return;const t=fmt(Date.now()-S.t0);["sw","hsw"].forEach(i=>{if($(i))$(i).textContent=t})}
function renderHost(){const H=$("host");H.hidden=!hostOpen;if(!hostOpen)return;
let b=`<div class="in"><div style="text-align:right"><button class="btn s r" onclick="A.host()">CLOSE ✕</button></div>`;
if(!authed)b+=`<div class="box c"><h2>Host Panel</h2><p>Enter host PIN</p><input id="pi" type="password" inputmode="numeric" onkeydown="if(event.key=='Enter')A.unlock()"><br><button class="btn" onclick="A.unlock()">UNLOCK</button><div id="pe" class="err" hidden>Wrong PIN</div></div>`;
else if(!S.teams)b+=`<div class="box c"><h2>Host Panel</h2><p>No game yet. Use Game Setup to generate cards.</p></div>`;
else{const n=N(),rem=S.ph=="draw"?n-S.i:0;
b+=`<div class="box c"><h2>Host Panel</h2><span class="stat">${n} participants</span><span class="stat">${K()} teams</span><span class="stat">${rem} cards left to draw</span><br>Team sizes: ${grp(S.teams.map(t=>t.size))}</div>
<div class="box"><b>Teams &amp; animals</b>${S.teams.map((t,ti)=>{const d=S.ph=="live"?fi(ti):-2;return `<div class="tm">${svg(t.a)}<span>${AN[t.a].n} · ${t.size} players${d>=0?` · ✔ #${d+1} (${fmt(S.fin[d].ms)})`:""}</span>${S.ph=="live"&&d<0?`<button class="btn s g" onclick="A.mark(${ti})">FINISHED</button>`:""}</div>`}).join("")}</div>`;
if(S.ph=="live")b+=`<div class="box c"><div class="sw" id="hsw" style="color:#3b2a5a;text-shadow:none;font-size:64px">00:00.0</div><button class="btn s o" onclick="A.undo()">Undo last</button><button class="btn s r" onclick="A.end()">STOP TIMER &amp; SHOW RESULTS</button></div>`;
if(S.ph=="ready")b+=`<div class="box c"><button class="btn g" onclick="A.start()">START THE GAME</button></div>`;
b+=`<div class="box c"><button class="btn s o" onclick="A.reshuffle()">${pend=="re"?"Tap again to confirm":"Restart &amp; reshuffle"}</button><button class="btn s r" onclick="A.newgame()">${pend=="new"?"Tap again to confirm":"New game / setup"}</button></div>`}
H.innerHTML=b+"</div>";tick()}
const A={
go(p){S.ph=p;save();render()},
cfg(k,v){S.cfg[k]=v;save();render()},
step(d){S.cfg.n=Math.min(30,Math.max(20,S.cfg.n+d));save();render()},
gen(){const p=plan(S.cfg);if(p.err)return;const ix=shuf([...AN.keys()]).slice(0,p.sizes.length);S.teams=p.sizes.map((s,i)=>({a:ix[i],size:s}));S.deck=shuf(S.teams.flatMap(t=>Array(t.size).fill(t.a)));S.i=0;S.step="ready";S.fin=[];S.ph="draw";save();render()},
reveal(){reveal=true;cd=5;render()},
hide(){if(!reveal)return;reveal=false;S.i++;S.step="hidden";if(S.i>=N())S.ph="ready";save();render()},
next(){S.step="ready";save();render()},
start(){hostOpen=false;authed=false;renderHost();cnt=3;S.ph="count";render();T.push(setInterval(()=>{cnt--;const e=$("cn");if(cnt>0)e.innerHTML=`<span class="pop">${cnt}</span>`;else if(cnt==0){e.classList.add("t");e.innerHTML=`<span class="pop">MAKE YOUR ANIMAL SOUND!</span>`}else{clr();S.ph="live";S.t0=Date.now();S.fin=[];save();render()}},1000))},
mark(ti){if(fi(ti)>=0)return;S.fin.push({ti,ms:Date.now()-S.t0});if(S.fin.length>=K())A.end();else{save();renderHost();render()}},
undo(){S.fin.pop();save();renderHost();render()},
end(){S.ph="results";hostOpen=false;authed=false;save();renderHost();render()},
host(){pend=null;hostOpen=!hostOpen;authed=true;renderHost()},
unlock(){if($("pi").value==S.cfg.pin){authed=true;renderHost()}else $("pe").hidden=false},
reshuffle(){if(pend!="re"){pend="re";renderHost();return}pend=null;hostOpen=false;authed=false;renderHost();A.gen()},
newgame(){if(S.ph!="results"&&pend!="new"){pend="new";renderHost();return}pend=null;hostOpen=false;authed=false;renderHost();S={ph:"setup",cfg:S.cfg};save();render()}
};
load();if(S.ph=="count")S.ph="ready";render();
</script></body></html>
